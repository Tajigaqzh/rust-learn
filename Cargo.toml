[package]
name = "rust-learn"
version = "0.1.0"
edition = "2024"

[features]
default = []
chapter24-demo = []

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rust-learn-demo"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }
unicode-segmentation = "1"
walkdir = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
# 第 30 章起真实使用 tokio（此前只是 reqwest 的传递依赖）；
# 只开需要的 feature，不引入 "full"。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[dev-dependencies]
criterion = "0.8"
# 把 criterion 传递依赖里的 zerocopy 钉在一个确定存在的版本上，
# 这样离线环境（以及锁定依赖的 CI）也能稳定复现构建。
zerocopy = "=0.8.55"

[[bench]]
name = "benchmarks"
harness = false
