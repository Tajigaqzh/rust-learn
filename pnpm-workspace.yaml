# 这个仓库没有子包，文档站就是根目录的 package.json。
#
# packages 字段必须显式写出来：pnpm 8 会把没有 packages 的 pnpm-workspace.yaml
# 当成非法配置（ERR_PNPM_INVALID_WORKSPACE_CONFIGURATION）。这里只声明根目录，
# 与「单包仓库」的实际结构一致。
packages:
  - "."

# pnpm 12 的设置也放在 pnpm-workspace.yaml 里（package.json 的 pnpm 字段已不再读取）。
# esbuild 的安装脚本要显式放行，否则 pnpm install 会以 ERR_PNPM_IGNORED_BUILDS 退出。
allowBuilds:
  esbuild: true
